<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DailyFlow — your personal diary timeline, rendered beautifully from Markdown.">
    <title>DailyFlow Timeline</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Marked.js for Markdown parsing -->
    <script src="vendor/marked.umd.js"></script>
</head>

<body>
    <header class="app-header">
        <div class="header-content">
            <h1>DailyFlow</h1>
            <p>Your Diary Timeline</p>
        </div>
        <div class="search-container">
            <select id="month-select" aria-label="Filter entries by month">
                <option value="">All</option>
            </select>
            <input type="search" id="search-input" placeholder="Search entries..." aria-label="Search entries">
        </div>
        <div class="header-actions">
            <button id="logout-btn" class="icon-button" type="button" title="Logout" aria-label="Logout">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
            <button id="theme-btn" class="icon-button" type="button" title="Toggle Theme" aria-label="Toggle Theme">
                <svg id="theme-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <!-- Icon will be updated by JS -->
                </svg>
            </button>
        </div>
    </header>

    <div class="main-layout">

        <main class="timeline-container">
            <div id="timeline" class="timeline">
                <!-- Timeline items will be injected here by app.js -->
            </div>
            <div id="loading-sentinel" class="loading-sentinel">
                <div class="spinner"></div>
            </div>
        </main>
    </div>

    <script src="app-core.js"></script>
    <script src="theme.js"></script>
    <script src="app.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to DailyFlow — your personal diary timeline.">
    <title>Login - DailyFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: var(--bg-color);
            font-family: var(--font-sans);
        }

        .login-wrapper {
            width: 100%;
            max-width: 400px;
            padding: 0 1.5rem;
        }

        .login-brand {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-brand h1 {
            font-family: var(--font-serif);
            font-size: 2rem;
            font-weight: 500;
            color: var(--text-main);
            line-height: 1.10;
            margin-bottom: 0.5rem;
        }

        .login-brand p {
            font-size: 0.94rem;
            color: var(--text-muted);
            line-height: 1.60;
        }

        .login-card {
            background: var(--card-bg);
            padding: 2rem 2rem 2.25rem;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-whisper) 0px 4px 24px;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
        }

        .form-group input {
            width: 100%;
            padding: 0.6rem 0.9rem;
            border-radius: 8px;
            border: 1px solid var(--border-strong);
            background: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            font-size: 0.94rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease,
                background-color 0.4s ease, color 0.4s ease;
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .form-group input:focus {
            border-color: var(--focus-ring);
            box-shadow: 0 0 0 2px rgba(56, 152, 236, 0.15);
        }

        .login-btn {
            width: 100%;
            padding: 0.7rem;
            margin-top: 0.5rem;
            background: var(--accent);
            color: #faf9f5;
            border: none;
            border-radius: 8px;
            font-family: var(--font-sans);
            font-weight: 500;
            font-size: 0.94rem;
            cursor: pointer;
            transition: opacity 0.2s ease, background-color 0.4s ease;
            box-shadow: var(--accent) 0px 0px 0px 0px, var(--accent) 0px 0px 0px 1px;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .login-btn:active {
            box-shadow: inset 0px 0px 0px 1px rgba(0, 0, 0, 0.15);
        }

        .error-msg {
            color: var(--error-color);
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="theme-toggle" style="position: fixed; top: 1rem; right: 1rem;">
        <button id="theme-btn" title="Toggle Theme">
            <svg id="theme-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <!-- Icon will be updated by JS -->
            </svg>
        </button>
    </div>

    <div class="login-wrapper">
        <div class="login-brand">
            <h1>DailyFlow</h1>
            <p>Your personal diary timeline</p>
        </div>

        <div class="login-card">
            <div id="error" class="error-msg">Invalid username or password.</div>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="login-btn">Sign In</button>
            </form>
        </div>
    </div>

    <script>
        // Theme logic
        const themeBtn = document.getElementById('theme-btn');
        const themeIcon = document.getElementById('theme-icon');
        const THEMES = ['system', 'light', 'dark'];
        const systemDarkQuery = window.matchMedia('(prefers-color-scheme: dark)');

        function updateThemeIcon(theme) {
            if (theme === 'system') {
                themeIcon.innerHTML = `<path d="M21 9C19.3529 9 17.8917 9.79647 16.9808 11.0253M21 6C18.5797 6 16.4104 7.07479 14.9434 8.77313M21 3C17.1326 3 13.7313 4.99586 11.77 8.01376M11.77 8.01376C9.72698 8.16181 8.00348 9.48869 7.25 11.25C4.7 11.6562 3 13.7572 3 16.0315C3 18.7755 5.28335 21 8.1 21L15.75 21C18.0972 21 20 19.1279 20 16.8185C20 15.1039 18.951 13.5202 17.45 12.875C17.4116 12.2181 17.2475 11.5941 16.9808 11.0253" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
            } else if (theme === 'light') {
                themeIcon.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
            } else {
                themeIcon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
            }
        }

        function applyTheme(theme) {
            if (theme === 'system') {
                document.documentElement.setAttribute('data-theme', systemDarkQuery.matches ? 'dark' : 'light');
            } else {
                document.documentElement.setAttribute('data-theme', theme);
            }
            localStorage.setItem('dailyflow-theme', theme);
            updateThemeIcon(theme);
        }

        systemDarkQuery.addEventListener('change', () => {
            if (localStorage.getItem('dailyflow-theme') === 'system') applyTheme('system');
        });

        let savedTheme = localStorage.getItem('dailyflow-theme') || 'system';
        applyTheme(savedTheme);

        themeBtn.addEventListener('click', () => {
            let currentTheme = localStorage.getItem('dailyflow-theme') || 'system';
            let nextIndex = (THEMES.indexOf(currentTheme) + 1) % THEMES.length;
            applyTheme(THEMES[nextIndex]);
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    window.location.href = '/';
                } else {
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.textContent = 'Server error. Please try again.';
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>

</html>

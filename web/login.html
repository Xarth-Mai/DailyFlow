<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to DailyFlow — your personal diary timeline.">
    <title>Login - DailyFlow</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: var(--bg-color);
            font-family: var(--font-sans);
        }

        .login-wrapper {
            width: 100%;
            max-width: 400px;
            padding: 0 1.5rem;
        }

        .login-brand {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-brand h1 {
            font-family: var(--font-serif);
            font-size: 2rem;
            font-weight: 500;
            color: var(--text-main);
            line-height: 1.10;
            margin-bottom: 0.5rem;
        }

        .login-brand p {
            font-size: 0.94rem;
            color: var(--text-muted);
            line-height: 1.60;
        }

        .login-card {
            background: var(--card-bg);
            padding: 2rem 2rem 2.25rem;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-whisper) 0px 4px 24px;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
        }

        .form-group input {
            width: 100%;
            padding: 0.6rem 0.9rem;
            border-radius: 8px;
            border: 1px solid var(--border-strong);
            background: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            font-size: 0.94rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease,
                background-color 0.4s ease, color 0.4s ease;
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .form-group input:focus {
            border-color: var(--focus-ring);
            box-shadow: 0 0 0 2px rgba(56, 152, 236, 0.15);
        }

        .login-btn {
            width: 100%;
            padding: 0.7rem;
            margin-top: 0.5rem;
            background: var(--accent);
            color: #faf9f5;
            border: none;
            border-radius: 8px;
            font-family: var(--font-sans);
            font-weight: 500;
            font-size: 0.94rem;
            cursor: pointer;
            transition: opacity 0.2s ease, background-color 0.4s ease;
            box-shadow: var(--accent) 0px 0px 0px 0px, var(--accent) 0px 0px 0px 1px;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .login-btn:active {
            box-shadow: inset 0px 0px 0px 1px rgba(0, 0, 0, 0.15);
        }

        .error-msg {
            color: var(--error-color);
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="theme-toggle" style="position: fixed; top: 1rem; right: 1rem;">
        <button id="theme-btn" class="icon-button" title="Toggle Theme" aria-label="Toggle theme" type="button">
            <svg id="theme-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <!-- Icon will be updated by JS -->
            </svg>
        </button>
    </div>

    <div class="login-wrapper">
        <div class="login-brand">
            <h1>DailyFlow</h1>
            <p>Your personal diary timeline</p>
        </div>

        <div class="login-card">
            <div id="error" class="error-msg">Invalid username or password.</div>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="login-btn">Sign In</button>
            </form>
        </div>
    </div>

    <script src="/app-core.js"></script>
    <script src="/theme.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    const returnPath = new URLSearchParams(window.location.search).get('return');
                    window.location.assign(DailyFlowCore.safeReturnPath(returnPath, window.location.origin));
                } else {
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.textContent = 'Server error. Please try again.';
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>

</html>
